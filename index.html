<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haris' Burger Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fff8f0;
        }
        header {
            background-color: #ff6347;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }
        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .burger-menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .burger-card {
            background-color: #fff;
            border: 2px solid #ff6347;
            border-radius: 10px;
            margin: 10px;
            padding: 15px;
            width: 200px;
            text-align: center;
            transition: transform 0.3s;
        }
        .burger-card:hover {
            transform: scale(1.05);
        }
        .burger-card img {
            width: 150px;
            border-radius: 10px;
        }
        footer {
            text-align: center;
            padding: 15px;
            background-color: #ff6347;
            color: white;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Haris' Burger Shop 🍔</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Contact</a>
        <a href="#">About Us</a>
    </nav>

    <div class="burger-menu">
        <div class="burger-card">
            <img src="https://via.placeholder.com/150" alt="Classic Burger">
            <h3>Classic Burger</h3>
            <p>$5.99</p>
        </div>
        <div class="burger-card">
            <img src="https://via.placeholder.com/150" alt="Cheese Burger">
            <h3>Cheese Burger</h3>
            <p>$6.99</p>
        </div>
        <div class="burger-card">
            <img src="https://via.placeholder.com/150" alt="Veggie Burger">
            <h3>Veggie Burger</h3>
            <p>$5.49</p>
        </div>
        <div class="burger-card">
            <img src="https://via.placeholder.com/150" alt="Double Burger">
            <h3>Double Burger</h3>
            <p>$7.99</p>
        </div>
    </div>

    <footer>
        &copy; 2026 Haris' Burger Shop. All rights reserved.
    </footer>
</body>
</html>
